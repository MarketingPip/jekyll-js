name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # Playground: bundle dist files alongside the playground
      - run: |
          mkdir -p playground/dist
          cp dist/jekyll-engine.js playground/dist/
          cp dist/sass-plugin.js playground/dist/
          cp dist/highlight-plugin.js playground/dist/
      # API docs via JSDoc
      - run: npx jsdoc src/engine.js -d playground/api
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
