# Deploys the Docusaurus documentation site to GitHub Pages.
# Build contract:
#   - repo root: `npm run build` regenerates the engine bundles in dist/
#     (the playground loads dist/ directly; CI rebuilds to prove it works)
#   - website/: Docusaurus build, outputs website/build/
name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Repo root deps + engine bundles (dist/) — inputs to the docs site.
      - run: npm ci
      - run: npm run build
      # 270-test gate — docs deploy must not ship a broken engine.
      - run: npm test
      # Docusaurus site: prebuild stages the playground, build emits
      # website/build/ (landing, versioned docs, search index, sitemap).
      - working-directory: website
        run: npm ci
      - working-directory: website
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
