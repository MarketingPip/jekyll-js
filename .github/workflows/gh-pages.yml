# Deploys the versioned documentation site to GitHub Pages.
# Build contract: `node site/build.mjs` produces the complete, self-contained
# site under `site/dist/` (landing page, guides, JSDoc API, playground).
# This workflow does not know or care how site/build.mjs builds it —
# it just uploads the directory.
name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Engine bundles (dist/) — inputs to the docs site build.
      - run: npm run build
      # Docs site build: produces the full versioned site in site/dist/.
      - run: node site/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
