      aceEditorInstance.getSelection().on('changeCursor', () => {
        const pos = aceEditorInstance.getCursorPosition();
        editorCursorPos.textContent = `Ln ${pos.row + 1}, Col ${pos.column + 1}`;
      });

      syncEditorFile(currentFile);
    }

    function syncEditorFile(filename) {
      if (!aceEditorInstance) return;
      currentFile = filename;
      activeFileBreadcrumb.textContent = filename;
      
      let mode = 'ace/mode/markdown';
      if (filename.endsWith('.html')) mode = 'ace/mode/html';
      else if (filename.endsWith('.yml') || filename.endsWith('.yaml') || filename === '_config.yml') {
        mode = 'ace/mode/yaml';
      }
      
      aceEditorInstance.getSession().setMode(mode);
      aceEditorInstance.setValue(vfs[filename] || '', -1);
      
      activeFileStatus.textContent = 'READY';
      activeFileStatus.className = 'text-[10px] font-semibold text-slate-500 font-mono tracking-wider uppercase';
    }

    // -------------------------------------------------------------
    // Nested Directory Sidebar — VS Code-style file explorer
    // -------------------------------------------------------------
    // treeState tracks folder expansion: { "_posts": true, "_includes": false }
    const treeState = {};
    // Explicitly-created folders that contain no files yet. Kept separate
    // from the VFS so folders can be truly empty (no placeholder files).
    // Entries are removed once a real file lands inside them.
    const emptyDirs = new Set();

    function getFileIcon(filepath, name) {
      if (filepath === '_config.yml') return '⚙️';
      if (name.endsWith('.html')) return '🌐';
      if (name.endsWith('.css') || name.endsWith('.scss') || name.endsWith('.sass')) return '🎨';
      if (name.endsWith('.js')) return '📜';
      if (name.endsWith('.yml') || name.endsWith('.yaml')) return '📋';
      if (name.endsWith('.md') || name.endsWith('.markdown')) return '📝';
      if (name.endsWith('.json')) return '📦';
      if (name.endsWith('.svg') || name.endsWith('.png') || name.endsWith('.jpg') || name.endsWith('.gif') || name.endsWith('.ico')) return '🖼️';
      if (name.startsWith('.')) return '🔒';
      if (name.startsWith('_')) return '📄';
      return '📄';
    }

    function buildTreeMap() {
      const rootMap = {};
      const ensureDir = (path) => {
        const steps = path.split('/');
        let cursor = rootMap;
        steps.forEach((step) => {
          cursor[step] ||= { _type: 'dir', children: {} };
          cursor = cursor[step].children;
        });
      };
      Object.keys(vfs).sort().forEach(path => {
        const steps = path.split('/');
        let cursor = rootMap;
        steps.forEach((step, idx) => {
          if (idx === steps.length - 1) {
            // Legacy `.gitkeep` placeholders (if any) stay hidden from the
            // tree UI; the directory itself is still rendered.
            if (step === '.gitkeep') return;
            cursor[step] = { _type: 'file', filepath: path };
          } else {
            cursor[step] ||= { _type: 'dir', children: {} };
            cursor = cursor[step].children;
          }
        });
      });
      // Explicitly-created empty folders have no VFS keys — render them too.
      for (const dirPath of emptyDirs) ensureDir(dirPath);
      return rootMap;
    }

    function getDirPath(parentPath, dirName) {
      return parentPath ? parentPath + '/' + dirName : dirName;
    }

    function countItems(obj) {
      let count = 0;
      for (const key of Object.keys(obj)) {
        if (obj[key]._type === 'dir') count += countItems(obj[key].children);
        else count++;
      }
      return count;
    }

    function setupFileTree() {
      const container = document.getElementById('vfs-tree-root');
      container.innerHTML = '';
      const rootMap = buildTreeMap();

      function renderItem(name, obj, depth, parentPath) {
        const dirPath = getDirPath(parentPath, name);

        if (obj._type === 'file') {
          const isActive = obj.filepath === currentFile;
          const div = document.createElement('div');
          div.className = `flex items-center gap-0.5 py-1 pr-1 rounded-md text-xs font-mono cursor-pointer transition-all ${
            isActive
              ? 'bg-cyan-950/80 text-cyan-300 font-semibold'
              : 'text-slate-300 hover:bg-slate-800/40 hover:text-white'
          }`;
          div.style.paddingLeft = (depth * 16 + 4) + 'px';

          const icon = getFileIcon(obj.filepath, name);
          div.innerHTML = `<span class="text-[11px] shrink-0 w-4 text-center">${icon}</span><span class="truncate flex-1">${escHtml(name)}</span>`;

          // Hover actions: rename + delete (mirrors folder headers)
          const fileActions = document.createElement('span');
          fileActions.className = 'hidden items-center gap-0.5 shrink-0';

          const renameFileBtn = document.createElement('button');
          renameFileBtn.className = 'text-slate-500 hover:text-cyan-400 p-0.5 rounded transition-colors';
          renameFileBtn.title = 'Rename file ' + name;
          renameFileBtn.setAttribute('aria-label', 'Rename file ' + name);
          renameFileBtn.innerHTML = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>';
          renameFileBtn.addEventListener('click', (e) => { e.stopPropagation(); openRenameFileModal(obj.filepath); });

          const delFileBtn = document.createElement('button');
          delFileBtn.className = 'text-slate-500 hover:text-rose-400 p-0.5 rounded transition-colors';
          delFileBtn.title = 'Delete file ' + name;
          delFileBtn.setAttribute('aria-label', 'Delete file ' + name);
          delFileBtn.innerHTML = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>';
          delFileBtn.addEventListener('click', (e) => { e.stopPropagation(); openDeleteFileModal(obj.filepath); });

          fileActions.appendChild(renameFileBtn);
          fileActions.appendChild(delFileBtn);
          div.appendChild(fileActions);

          // Hover to reveal actions
          div.addEventListener('mouseenter', () => { fileActions.classList.remove('hidden'); fileActions.classList.add('flex'); });
          div.addEventListener('mouseleave', () => { fileActions.classList.add('hidden'); fileActions.classList.remove('flex'); });

          div.onclick = (e) => {
            e.stopPropagation();
            syncEditorFile(obj.filepath);
            setupFileTree();
            if (window.innerWidth < 1024) showMobilePane('editor');
          };
          div.ondblclick = (e) => {
            e.stopPropagation();
            if (isActive) return;
            syncEditorFile(obj.filepath);
            setupFileTree();
            if (window.innerWidth < 1024) showMobilePane('editor');
          };
          return div;
        }

        // Directory
        const dirWrap = document.createElement('div');
        dirWrap.className = 'select-none';

        const isExpanded = treeState[dirPath] !== false;
        const childCount = countItems(obj.children);
        // A folder "has children" when it contains files OR subfolders —
        // an explicitly-created empty subfolder still needs to render.
        const hasChildren = Object.keys(obj.children).length > 0;

        // Header row
        const header = document.createElement('div');
        header.className = 'flex items-center gap-0.5 py-0.5 pr-1 rounded-md text-xs cursor-pointer transition-all hover:bg-slate-800/30';
        header.style.paddingLeft = (depth * 16) + 'px';

        // Chevron
        const chevron = document.createElement('span');
        chevron.className = 'text-slate-500 text-[10px] w-4 h-4 flex items-center justify-center shrink-0 transition-transform duration-150';
        chevron.textContent = hasChildren ? (isExpanded ? '▾' : '▸') : '';
        header.appendChild(chevron);

        // Folder icon
        const folderIcon = document.createElement('span');
        folderIcon.className = 'text-[11px] shrink-0 w-4 text-center';
        folderIcon.textContent = isExpanded ? '📂' : '📁';
        header.appendChild(folderIcon);

        // Name
        const nameSpan = document.createElement('span');
        nameSpan.className = 'truncate flex-1 text-slate-400 font-medium';
        nameSpan.textContent = name;
        header.appendChild(nameSpan);

        // Item count badge
        if (childCount > 0) {
          const badge = document.createElement('span');
          badge.className = 'text-[9px] text-slate-600 font-mono bg-slate-800/50 px-1 py-0.5 rounded-full shrink-0';
          badge.textContent = childCount;
          header.appendChild(badge);
        }

        // Actions: new file + new folder
        const actions = document.createElement('span');
        actions.className = 'hidden group-hover:flex items-center gap-0.5 shrink-0';

        const addFileBtn = document.createElement('button');
        addFileBtn.className = 'text-slate-500 hover:text-cyan-400 p-0.5 rounded transition-colors';
        addFileBtn.title = 'New file in ' + name;
        addFileBtn.setAttribute('aria-label', 'New file in ' + name);
        addFileBtn.innerHTML = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>';
        addFileBtn.addEventListener('click', (e) => { e.stopPropagation(); openNewFileModal(dirPath); });

        const addDirBtn = document.createElement('button');
        addDirBtn.className = 'text-slate-500 hover:text-cyan-400 p-0.5 rounded transition-colors';
        addDirBtn.title = 'New folder in ' + name;
        addDirBtn.setAttribute('aria-label', 'New folder in ' + name);
        addDirBtn.innerHTML = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>';
        addDirBtn.addEventListener('click', (e) => { e.stopPropagation(); openNewFolderModal(dirPath); });

        const renameDirBtn = document.createElement('button');
        renameDirBtn.className = 'text-slate-500 hover:text-cyan-400 p-0.5 rounded transition-colors';
        renameDirBtn.title = 'Rename folder ' + name;
        renameDirBtn.setAttribute('aria-label', 'Rename folder ' + name);
        renameDirBtn.innerHTML = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>';
        renameDirBtn.addEventListener('click', (e) => { e.stopPropagation(); openRenameFolderModal(dirPath); });

        const delDirBtn = document.createElement('button');
        delDirBtn.className = 'text-slate-500 hover:text-rose-400 p-0.5 rounded transition-colors';
        delDirBtn.title = 'Delete folder ' + name;
        delDirBtn.setAttribute('aria-label', 'Delete folder ' + name);
        delDirBtn.innerHTML = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>';
        delDirBtn.addEventListener('click', (e) => { e.stopPropagation(); openDeleteFolderModal(dirPath); });

        actions.appendChild(addFileBtn);
        actions.appendChild(addDirBtn);
        actions.appendChild(renameDirBtn);
        actions.appendChild(delDirBtn);
        header.appendChild(actions);

        // Hover to reveal actions
        header.addEventListener('mouseenter', () => actions.classList.remove('hidden'));
        header.addEventListener('mouseleave', () => actions.classList.add('hidden'));

        // Toggle expand/collapse
        header.onclick = (e) => {
          if (e.target.closest('button')) return;
          if (hasChildren) {
            treeState[dirPath] = !isExpanded;
            setupFileTree();
          } else {
            // Empty folder: prompt to create first file
            openNewFileModal(dirPath);
          }
        };

        dirWrap.appendChild(header);

        // Children container
        if (hasChildren) {
          const childContainer = document.createElement('div');
          childContainer.className = isExpanded ? '' : 'hidden';
          childContainer.dataset.dirPath = 'children-' + dirPath;

          const sorted = Object.entries(obj.children).sort((a, b) => {
            if (a[1]._type !== b[1]._type) return a[1]._type === 'dir' ? -1 : 1;
            return a[0].localeCompare(b[0]);
          });

          for (const [cName, cObj] of sorted) {
            childContainer.appendChild(renderItem(cName, cObj, depth + 1, dirPath));
          }
          dirWrap.appendChild(childContainer);
        }

        return dirWrap;
      }

      // Sort: dirs first, then files, both alphabetically
      const dirs = [];
      const files = [];
      for (const [name, obj] of Object.entries(rootMap)) {
        if (obj._type === 'dir') dirs.push([name, obj]);
        else files.push([name, obj]);
      }

      for (const [name, obj] of dirs) {
        container.appendChild(renderItem(name, obj, 0, ''));
      }
      for (const [name, obj] of files) {
        container.appendChild(renderItem(name, obj, 0, ''));
      }
    }

    // -------------------------------------------------------------
    // Reusable accessible modal system
    // -------------------------------------------------------------
    const modalOverlay = document.getElementById('modal-overlay');
    const modalDialog = document.getElementById('modal-dialog');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalBody = document.getElementById('modal-body');
    const modalError = document.getElementById('modal-error');
    const modalCancel = document.getElementById('modal-cancel');
    const modalConfirm = document.getElementById('modal-confirm');

    let modalPrevFocus = null;   // element that had focus before the modal opened
    let modalOnConfirm = null;   // confirm callback for the currently open modal
    let modalKeyHandler = null;  // bound keydown handler (removed on close)

    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function openModal({ title, desc = '', bodyHTML = '', confirmLabel = 'Confirm', confirmKind = 'primary', onConfirm = null }) {
      modalPrevFocus = document.activeElement;
      modalTitle.textContent = title;
      modalDesc.innerHTML = desc;
      modalBody.innerHTML = bodyHTML;
      modalError.textContent = '';
      modalError.classList.add('hidden');

      modalConfirm.textContent = confirmLabel;
      modalConfirm.className =
        'px-4 py-1.5 text-xs font-bold rounded-lg transition-all active:scale-95 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 ' +
        (confirmKind === 'danger'
          ? 'bg-rose-600 hover:bg-rose-500 text-white focus:ring-rose-400'
          : 'bg-cyan-500 hover:bg-cyan-400 text-slate-950 focus:ring-cyan-400');
      modalOnConfirm = onConfirm;

      modalOverlay.classList.remove('modal-hidden');
      document.body.style.overflow = 'hidden';

      // Focus trap + ESC handling (listener removed on close)
      modalKeyHandler = (e) => {
        if (e.key === 'Escape') {
          e.preventDefault();
          closeModal();
          return;
        }
        if (e.key !== 'Tab') return;
        const focusable = modalDialog.querySelectorAll(
          'button:not([disabled]), input:not([disabled]), [tabindex]:not([tabindex="-1"])'
        );
        if (focusable.length === 0) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      };
      modalDialog.addEventListener('keydown', modalKeyHandler);

      // Initial focus: the input when present; for destructive dialogs focus
      // Cancel so Enter never confirms a delete by accident.
      requestAnimationFrame(() => {
        const input = modalDialog.querySelector('input');
        if (input) input.focus();
        else if (confirmKind === 'danger') modalCancel.focus();
        else modalConfirm.focus();
      });
    }

    function modalShowError(msg) {
      modalError.textContent = msg;
      modalError.classList.remove('hidden');
    }

    function closeModal() {
      modalOverlay.classList.add('modal-hidden');
      document.body.style.overflow = '';
      if (modalKeyHandler) {
        modalDialog.removeEventListener('keydown', modalKeyHandler);
        modalKeyHandler = null;
      }
      modalOnConfirm = null;
      modalBody.innerHTML = '';
      if (modalPrevFocus && typeof modalPrevFocus.focus === 'function') {
        modalPrevFocus.focus();
      }
      modalPrevFocus = null;
    }

    modalCancel.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });
    modalConfirm.addEventListener('click', () => {
      if (modalOnConfirm) modalOnConfirm();
    });

    // -------------------------------------------------------------
    // File / folder operations (all go through the modal)
    // -------------------------------------------------------------
    function dirName(p) {
      const i = p.lastIndexOf('/');
      return i === -1 ? '' : p.slice(0, i);
    }

    // Mark every segment of a directory path as expanded so the tree
    // reveals newly created items.
    function expandDir(dirPath) {
      if (!dirPath) return;
      let p = '';
      for (const part of dirPath.split('/')) {
        p = p ? p + '/' + part : part;
        treeState[p] = true;
      }
    }

    function nameInputHTML(label, placeholder, value) {
      const valAttr = value != null && value !== '' ? ' value="' + escHtml(value) + '"' : '';
      return (
        '<label class="block text-[11px] font-medium text-slate-400 mb-1.5" for="modal-name-input">' + escHtml(label) + '</label>' +
        '<input id="modal-name-input" type="text" placeholder="' + escHtml(placeholder) + '"' + valAttr + ' autocomplete="off" spellcheck="false" ' +
        'class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 font-mono">'
      );
    }

    // Last path segment (file or folder name without its parent dirs).
    function lastSegment(p) {
      const i = p.lastIndexOf('/');
      return i === -1 ? p : p.slice(i + 1);
    }

    // True when a file or folder (real or a tracked empty folder) already
    // occupies path p. Note: creating a file *inside* a tracked empty
    // folder is not a conflict — it just fills the folder.
    function pathExists(p) {
      if (vfs[p]) return true;
      if (Object.keys(vfs).some((k) => k === p || k.startsWith(p + '/'))) return true;
      for (const d of emptyDirs) {
        if (d === p || d.startsWith(p + '/')) return true;
      }
      return false;
    }

    // A real file just landed at fullPath — any tracked empty folders on
    // that path are no longer empty.
    function clearEmptyDirsAlong(fullPath) {
      for (const d of [...emptyDirs]) {
        if (fullPath === d || fullPath.startsWith(d + '/')) emptyDirs.delete(d);
      }
    }

    // Wire Enter-to-submit on the modal's name input.
    function submitOnEnter() {
      const input = document.getElementById('modal-name-input');
      if (input) {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            modalConfirm.click();
          }
        });
      }
    }

    function openNewFileModal(parentDir) {
      const where = parentDir
        ? ' in <code class="text-cyan-400 font-mono bg-slate-950 px-1 rounded">' + escHtml(parentDir) + '</code>'
        : ' at the workspace root';
      openModal({
        title: 'New file',
        desc: 'Create a file' + where + '. Slashes create nested folders automatically.',
        bodyHTML: nameInputHTML('File name or path', 'e.g. _posts/2026-10-08-hello.md'),
        confirmLabel: 'Create file',
        confirmKind: 'primary',
        onConfirm: () => {
          const input = document.getElementById('modal-name-input');
          const name = input.value.trim().replace(/^\/+/, '');
          if (!name) {
            modalShowError('Please enter a file name.');
            input.focus();
            return;
          }
          const fullPath = parentDir ? parentDir + '/' + name : name;
          if (pathExists(fullPath)) {
            modalShowError('A file or folder with that name already exists.');
            input.focus();
            input.select();
            return;
          }
          vfs[fullPath] = '';
          clearEmptyDirsAlong(fullPath);
          expandDir(dirName(fullPath));
          closeModal();
          syncEditorFile(fullPath);
          setupFileTree();
          log('info', 'File created: ' + fullPath);
        },
      });
      submitOnEnter();
    }

    function openNewFolderModal(parentDir) {
      const where = parentDir
        ? ' inside <code class="text-cyan-400 font-mono bg-slate-950 px-1 rounded">' + escHtml(parentDir) + '</code>'
        : ' at the workspace root';
      openModal({
        title: 'New folder',
        desc: 'Create a folder' + where + '.',
        bodyHTML: nameInputHTML('Folder name', 'e.g. assets'),
        confirmLabel: 'Create folder',
        confirmKind: 'primary',
        onConfirm: () => {
          const input = document.getElementById('modal-name-input');
          const name = input.value.trim();
          if (!name) {
            modalShowError('Please enter a folder name.');
            input.focus();
            return;
          }
          if (name.includes('/')) {
            modalShowError('Folder names cannot contain slashes — create nested folders one at a time.');
            input.focus();
            input.select();
            return;
          }
          const fullPath = parentDir ? parentDir + '/' + name : name;
          if (pathExists(fullPath)) {
            modalShowError('A file or folder with that name already exists.');
            input.focus();
            input.select();
            return;
          }
          // Track as an explicitly empty folder — no placeholder files.
          // buildTreeMap renders it until it gains real files.
          emptyDirs.add(fullPath);
          expandDir(fullPath);
          treeState[fullPath] = true;
          closeModal();
          setupFileTree();
          log('info', 'Folder created: ' + fullPath + '/');
        },
      });
      submitOnEnter();
    }

    function openDeleteFileModal(filepath) {
      openModal({
        title: 'Delete file?',
        desc: 'This will permanently delete <code class="text-rose-400 font-mono bg-slate-950 px-1 rounded">' + escHtml(filepath) + '</code>. This cannot be undone.',
        confirmLabel: 'Delete',
        confirmKind: 'danger',
        onConfirm: () => {
          delete vfs[filepath];
          closeModal();
          const remaining = Object.keys(vfs)[0];
          if (remaining) syncEditorFile(remaining);
          setupFileTree();
          log('warn', 'Deleted file: ' + filepath);
        },
      });
    }

    function openDeleteFolderModal(dirPath) {
      const prefix = dirPath + '/';
      const doomed = Object.keys(vfs).filter((k) => k === dirPath || k.startsWith(prefix));
      const visible = doomed.filter((k) => k.split('/').pop() !== '.gitkeep');
      const fileWord = visible.length === 0
        ? 'which is empty'
        : 'and ' + (visible.length === 1 ? 'the 1 file' : 'all ' + visible.length + ' files') + ' inside it';
      openModal({
        title: 'Delete folder?',
        desc:
          'This will permanently delete the folder <code class="text-rose-400 font-mono bg-slate-950 px-1 rounded">' + escHtml(dirPath) + '</code> ' +
          fileWord + '. This cannot be undone.',
        confirmLabel: 'Delete',
        confirmKind: 'danger',
        onConfirm: () => {
          if (doomed.length >= Object.keys(vfs).length) {
            modalShowError('This would delete every file in the workspace. Delete files individually instead.');
            return;
          }
          for (const k of doomed) delete vfs[k];
          for (const d of [...emptyDirs]) {
            if (d === dirPath || d.startsWith(prefix)) emptyDirs.delete(d);
          }
          closeModal();
          if (!vfs[currentFile]) {
            const remaining = Object.keys(vfs)[0];
            if (remaining) syncEditorFile(remaining);
          }
          setupFileTree();
          log('warn', 'Deleted folder: ' + dirPath + '/ (' + visible.length + ' file(s))');
        },
      });
    }

    function openRenameFileModal(filepath) {
      const parent = dirName(filepath);
      const oldName = lastSegment(filepath);
      openModal({
        title: 'Rename file',
        desc: 'Rename <code class="text-cyan-400 font-mono bg-slate-950 px-1 rounded">' + escHtml(filepath) + '</code>.',
        bodyHTML: nameInputHTML('New name', oldName, oldName),
        confirmLabel: 'Rename',
        confirmKind: 'primary',
        onConfirm: () => {
          const input = document.getElementById('modal-name-input');
          const newName = input.value.trim();
          if (!newName) {
            modalShowError('Please enter a name.');
            input.focus();
            return;
          }
          if (newName.includes('/')) {
            modalShowError('File names cannot contain slashes.');
            input.focus();
            input.select();
            return;
          }
          if (newName === oldName) {
            closeModal();
            return;
          }
          const newPath = parent ? parent + '/' + newName : newName;
          if (pathExists(newPath)) {
            modalShowError('A file or folder with that name already exists.');
            input.focus();
            input.select();
            return;
          }
          vfs[newPath] = vfs[filepath];
          delete vfs[filepath];
          closeModal();
          if (currentFile === filepath) {
            syncEditorFile(newPath);
          }
          setupFileTree();
          log('info', 'Renamed: ' + filepath + ' → ' + newPath);
        },
      });
      submitOnEnter();
      const input = document.getElementById('modal-name-input');
      if (input) input.select();
    }

    function openRenameFolderModal(dirPath) {
      const parent = dirName(dirPath);
      const oldName = lastSegment(dirPath);
      openModal({
        title: 'Rename folder',
        desc: 'Rename <code class="text-cyan-400 font-mono bg-slate-950 px-1 rounded">' + escHtml(dirPath) + '</code>. Every file inside moves with it.',
        bodyHTML: nameInputHTML('New name', oldName, oldName),
        confirmLabel: 'Rename',
        confirmKind: 'primary',
        onConfirm: () => {
          const input = document.getElementById('modal-name-input');
          const newName = input.value.trim();
          if (!newName) {
            modalShowError('Please enter a name.');
            input.focus();
            return;
          }
          if (newName.includes('/')) {
            modalShowError('Folder names cannot contain slashes.');
            input.focus();
            input.select();
            return;
          }
          if (newName === oldName) {
            closeModal();
            return;
          }
          const newPath = parent ? parent + '/' + newName : newName;
          if (pathExists(newPath)) {
            modalShowError('A file or folder with that name already exists.');
            input.focus();
            input.select();
            return;
          }
          const oldPrefix = dirPath + '/';
          const newPrefix = newPath + '/';
          const moved = [];
          for (const k of Object.keys(vfs)) {
            if (k === dirPath || k.startsWith(oldPrefix)) {
              moved.push([k, vfs[k]]);
            }
          }
          for (const [k] of moved) delete vfs[k];
          for (const [k, v] of moved) {
            vfs[k === dirPath ? newPath : newPrefix + k.slice(oldPrefix.length)] = v;
          }
          // Migrate expansion state so the renamed folder stays open.
          for (const k of Object.keys(treeState)) {
            if (k === dirPath || k.startsWith(oldPrefix)) {
              treeState[k === dirPath ? newPath : newPrefix + k.slice(oldPrefix.length)] = treeState[k];
              delete treeState[k];
            }
          }
          // Migrate tracked empty folders.
          for (const d of [...emptyDirs]) {
            if (d === dirPath || d.startsWith(oldPrefix)) {
              emptyDirs.delete(d);
              emptyDirs.add(d === dirPath ? newPath : newPrefix + d.slice(oldPrefix.length));
            }
          }
          expandDir(dirName(newPath));
          treeState[newPath] = true;
          closeModal();
          if (currentFile === dirPath || currentFile.startsWith(oldPrefix)) {
            syncEditorFile(currentFile === dirPath ? newPath : newPrefix + currentFile.slice(oldPrefix.length));
          }
          setupFileTree();
          log('info', 'Renamed folder: ' + dirPath + '/ → ' + newPath + '/');
        },
      });
      submitOnEnter();
      const input = document.getElementById('modal-name-input');
      if (input) input.select();
    }

    // -------------------------------------------------------------
    // Dynamic Log Printer
    // -------------------------------------------------------------
    function log(level, message) {
      const time = new Date().toLocaleTimeString();
      const levelColors = {
        info: 'text-slate-400',
        warn: 'text-amber-400',
        error: 'text-rose-400',
        success: 'text-cyan-400 font-bold'
      };
      
      consoleLogs.push({ time, level, message });
      consoleContent.innerHTML = consoleLogs.map(item => 
        `<div class="flex gap-2 leading-relaxed"><span class="text-slate-600 shrink-0">[${item.time}]</span><span class="${levelColors[item.level]}">${item.message}</span></div>`
      ).join('');
      consoleContent.scrollTop = consoleContent.scrollHeight;
    }

    // -------------------------------------------------------------
    // Build Trigger System
    // -------------------------------------------------------------
    // -------------------------------------------------------------
    // Optional plugins (lazy-loaded): heavy dependencies ship as
    // separate chunks that are fetched only when the site needs them.
    // The core dist stays lean (~219KB).
    // -------------------------------------------------------------
    const OPTIONAL_PLUGINS = [
      {
        label: 'Sass',
        src: './dist/sass-plugin.js',
        global: 'JekyllSass',
        option: 'sass',
        needs: (vfs) => Object.keys(vfs).some((k) => /\.(scss|sass)$/i.test(k)),
      },
      {
        label: 'syntax highlighter',
        src: './dist/highlight-plugin.js',
        global: 'JekyllHighlight',
        option: 'highlighter',
        needs: (vfs) =>
          Object.values(vfs).some(
            (c) => typeof c === 'string' && /\{%\s*highlight[\s%]/.test(c)
          ),
      },
    ];

    async function ensurePlugin(plugin) {
      if (window[plugin.global]) return window[plugin.global];
      log('info', `Site uses ${plugin.label} — lazy-loading the plugin...`);
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = plugin.src;
        s.onload = resolve;
        s.onerror = () => reject(new Error(`Failed to load ${plugin.src}`));
        document.head.appendChild(s);
      });
      log('info', `${plugin.label} plugin loaded.`);
      return window[plugin.global];
    }

    async function executeCompile() {
      buildBtn.disabled = true;
      buildText.textContent = 'Compiling...';
      buildIcon.classList.add('animate-spin');
      
      consoleLogs = [];
      log('info', 'Starting runtime build process...');

      await new Promise(r => setTimeout(r, 400));

      try {
        const engineOpts = {
          vfs: vfs,
          logger: (msg, lvl) => log(lvl, msg),
          stdout: (msg, lvl) => console.log(msg),
        };
        // Bring each optional plugin only if the site needs it.
        for (const plugin of OPTIONAL_PLUGINS) {
          if (plugin.needs(vfs)) {
            engineOpts[plugin.option] = await ensurePlugin(plugin);
          }
        }
        const engine = new JekyllEngine(engineOpts);

        compiledPages = await engine.build();

        updateLivePreviewFrame();
        updateCompiledHTMLPane();
        updateJSONOutputPane();

      } catch (err) {
        log('error', `Build Pipeline Aborted: ${err.message}`);
      } finally {
        buildBtn.disabled = false;
        buildText.textContent = 'Build Pages';
        buildIcon.classList.remove('animate-spin');
      }
    }

    // -------------------------------------------------------------
    // Sandbox Navigation Router & Interceptor
    // -------------------------------------------------------------
    function findPageByHref(href, pages) {
      if (!href) return null;
      let cleaned = href.trim();
console.log(pages)
      try {
        const urlObj = new URL(cleaned, window.location.href);
        if (urlObj.origin === window.location.origin) {
          cleaned = urlObj.pathname;
        }
      } catch(e) {
        console.log(e)
        
      }

      let match = pages.find(p => p.permalink === cleaned || p.permalink === cleaned + '/' || p.permalink === '/' + cleaned);
      if (match) return match;

      const cleanTarget = cleaned.replace(/\/$/, '').replace(/\/index\.html$/, '').replace(/^\//, '');
      
      return pages.find(p => {
        const cleanPerm = p.permalink.replace(/\/$/, '').replace(/\/index\.html$/, '').replace(/^\//, '');
        return cleanPerm === cleanTarget;
      });
    }

    function injectSandboxRouterInterceptors(iframe) {
      try {
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        const links = iframeDoc.getElementsByTagName('a');

        for (let link of links) {
          const href = link.getAttribute('href');
          
          if (!href || href.startsWith('http://') || href.startsWith('https://') || href.startsWith('//')) {
            link.setAttribute('target', '_blank');
            continue;
          }

          link.addEventListener('click', (e) => {
            e.preventDefault();
            const matched = findPageByHref(href, compiledPages);
            if (matched) {
              log('info', `Local navigation route triggered -> ${matched.permalink}`);
              renderPreviewPageContent(matched);
            } else {
              log('warn', `Internal route not compiled: "${href}"`);
            }
          });
        }
      } catch (err) {
        console.error("Interceptor failed injecting sandbox bindings:", err);
      }
    }

    function renderPreviewPageContent(pageObj) {
      previewPath.textContent = pageObj.permalink;

      const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
      doc.open();
      doc.write(pageObj.content);
      doc.close();

      injectSandboxRouterInterceptors(previewFrame);
    }

    function updateLivePreviewFrame() {
      if (compiledPages.length === 0) return;
      
      const home = compiledPages.find(p => p.permalink === '/' || p.permalink === '/index.html' || p.path === 'index.md') || compiledPages[0];
      renderPreviewPageContent(home);
    }

    // Formatter used strictly for raw text presentation inside the 'Compiled HTML' tab
    function updateCompiledHTMLPane() {
      if (compiledPages.length === 0) {
        htmlContent.textContent = 'Resource empty.';
        return;
      }
      const home = compiledPages.find(p => p.permalink === '/' || p.permalink === '/index.html' || p.path === 'index.md') || compiledPages[0];
      
      htmlContent.textContent = formatHTML(home.content);
    }

    function updateJSONOutputPane() {
      jsonContent.textContent = JSON.stringify(compiledPages, null, 2);
    }

    function formatHTML(html) {
      let formatted = '';
      let indent = '';
      const tab = '  ';
      html.split(/></).forEach((element, i) => {
        if (i > 0) element = '<' + element;
        if (i < html.split(/></).length - 1) element = element + '>';

        if (element.match(/^\s*<\/\w/)) indent = indent.substring(tab.length);
        formatted += indent + element + '\n';
        if (element.match(/^<\w[^>]*[^\/]>.*$/)) indent += tab;
      });
      return formatted;
    }

    // -------------------------------------------------------------
    // Display Sandbox Theme Toggles
    // -------------------------------------------------------------
    document.getElementById('preview-light').addEventListener('click', () => {
      previewFrame.style.backgroundColor = 'white';
      document.getElementById('preview-light').className = 'px-2 py-0.5 rounded text-[10px] font-medium bg-slate-700 text-white transition-all';
      document.getElementById('preview-dark').className = 'px-2 py-0.5 rounded text-[10px] font-medium text-slate-400 hover:text-white transition-all';
    });

    document.getElementById('preview-dark').addEventListener('click', () => {
      previewFrame.style.backgroundColor = '#0f172a';
      document.getElementById('preview-dark').className = 'px-2 py-0.5 rounded text-[10px] font-medium bg-slate-700 text-white transition-all';
      document.getElementById('preview-light').className = 'px-2 py-0.5 rounded text-[10px] font-medium text-slate-400 hover:text-white transition-all';
    });

    // -------------------------------------------------------------
    // Output Interface View Selector Tabs
    // -------------------------------------------------------------
    document.querySelectorAll('.output-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const target = tab.dataset.tab;
        activeOutputTab = target;

        document.querySelectorAll('.output-tab').forEach(t => {
          t.className = 'output-tab tab-inactive px-4 py-2.5 text-xs font-medium tracking-wide transition-all border-b-2 text-slate-400 hover:text-slate-200 border-transparent';
        });
        tab.className = 'output-tab tab-active px-4 py-2.5 text-xs font-semibold tracking-wide transition-all border-b-2 border-cyan-500 text-cyan-400 bg-slate-900/10';

        document.querySelectorAll('.output-pane').forEach(p => p.classList.add('hidden'));
        document.getElementById(`output-pane-${target}`).classList.remove('hidden');
      });
    });

    // -------------------------------------------------------------
    // File Manipulation Controls
    // -------------------------------------------------------------
    document.getElementById('btn-add-file').addEventListener('click', () => {
      // Create inside the folder of the currently viewed file ('' = root).
      openNewFileModal(dirName(currentFile));
    });

    document.getElementById('btn-add-folder').addEventListener('click', () => {
      // Create inside the folder of the currently viewed file ('' = root).
      openNewFolderModal(dirName(currentFile));
    });

    document.getElementById('btn-delete-file').addEventListener('click', () => {
      if (Object.keys(vfs).length <= 1) {
        log('warn', 'Action aborted — at least one file must exist in the workspace.');
        return;
      }
      openDeleteFileModal(currentFile);
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (confirm('Revert all files? This deletes custom items.')) {
        vfs = JSON.parse(JSON.stringify(defaultVFS));
        syncEditorFile('index.md');
        setupFileTree();
        log('info', 'Workspace reset completed.');
      }
    });

    buildBtn.addEventListener('click', executeCompile);

    // -------------------------------------------------------------
    // Mobile Workframe Panes Control
    // -------------------------------------------------------------
    window.showMobilePane = function(paneId) {
      const sidebar = document.getElementById('workspace-sidebar');
      const editor = document.getElementById('workspace-editor');
      const preview = document.getElementById('workspace-preview');

      document.getElementById('mobile-tab-sidebar').className = "flex-1 py-2.5 text-center font-medium border-b-2 border-transparent text-slate-400";
      document.getElementById('mobile-tab-editor').className = "flex-1 py-2.5 text-center font-medium border-b-2 border-transparent text-slate-400";
      document.getElementById('mobile-tab-preview').className = "flex-1 py-2.5 text-center font-medium border-b-2 border-transparent text-slate-400";

      sidebar.classList.add('hidden');
      editor.classList.add('hidden');
      preview.classList.add('hidden');

      if (paneId === 'sidebar') {
        sidebar.classList.remove('hidden');
        document.getElementById('mobile-tab-sidebar').className = "flex-1 py-2.5 text-center font-semibold border-b-2 border-cyan-500 text-cyan-400 bg-slate-900/30";
      } else if (paneId === 'editor') {
        editor.classList.remove('hidden');
        editor.classList.add('flex');
        document.getElementById('mobile-tab-editor').className = "flex-1 py-2.5 text-center font-semibold border-b-2 border-cyan-500 text-cyan-400 bg-slate-900/30";
        if (aceEditorInstance) aceEditorInstance.resize();
      } else if (paneId === 'preview') {
        preview.classList.remove('hidden');
        preview.classList.add('flex');
        document.getElementById('mobile-tab-preview').className = "flex-1 py-2.5 text-center font-semibold border-b-2 border-cyan-500 text-cyan-400 bg-slate-900/30";
      }
    };

    window.addEventListener('resize', () => {
      if (window.innerWidth >= 1024) {
        document.getElementById('workspace-sidebar').classList.remove('hidden');
        document.getElementById('workspace-editor').classList.remove('hidden'); 
        document.getElementById('workspace-editor').classList.add('flex');
        document.getElementById('workspace-preview').classList.remove('hidden');
        document.getElementById('workspace-preview').classList.add('flex');
      } else {
        showMobilePane('editor');
      }
    });

    // -------------------------------------------------------------
    // Boot Initialization
    // -------------------------------------------------------------
    setupAceEditor();
    setupFileTree();
    
    if (window.innerWidth < 1024) {
      showMobilePane('editor');
    }

    setTimeout(() => executeCompile(), 300);
  </script>
